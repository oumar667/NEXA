<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXA - Next Gen</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --surface-color: #16161a;
            --surface-glass: rgba(22, 22, 26, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f6;
            --text-secondary: #9898a0;
            --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #60a5fa 50%, #34d399 100%);
            --accent-solid: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-weight: 600;
        }

        /* Sidebar latérale */
        #sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 99;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex: 1;
            max-width: 500px;
            margin: auto;
            width: 100%;
            padding: 20px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-screen h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .welcome-screen p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.5;
        }

        .message {
            max-width: 88%;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            animation: messagePop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes messagePop {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--surface-color);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .ai-message {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 100%;
        }

        .input-area {
            padding: 16px 20px 24px 20px;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            border-radius: 32px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .input-box-wrapper:focus-within {
            border-color: rgba(129, 140, 248, 0.5);
            box-shadow: 0 8px 32px rgba(129, 140, 248, 0.15);
        }

        #file-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #file-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 8px 12px;
            outline: none;
            resize: none;
            max-height: 120px;
        }

        #user-input::placeholder {
            color: var(--text-secondary);
        }

        #send-btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
            transition: transform 0.2s, opacity 0.2s;
        }

        #send-btn:active {
            transform: scale(0.92);
        }

        .attachment-preview {
            font-size: 0.8rem;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.1);
            padding: 6px 14px;
            border-radius: 12px;
            align-self: flex-start;
            display: none;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
    </style>
</head>
<body>

    <!-- Overlay pour la sidebar -->
    <div id="overlay" class="overlay"></div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span>Menu NEXA</span>
            <button class="icon-btn" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-content">
            <p>Historique et options bientôt disponibles ici.</p>
        </div>
    </div>

    <header>
        <div class="header-left">
            <button class="icon-btn" id="menu-btn" title="Menu">☰</button>
            <div class="logo-area">
                <span>✨</span> NEXA
            </div>
        </div>
        <div class="header-right">
            <div id="status" class="status-badge">ONLINE</div>
            <button class="icon-btn" id="new-chat-btn" title="Nouveau chat">✏️</button>
            <button class="icon-btn" id="options-btn" title="Options">⋯</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="welcome-screen">
            <div class="welcome-icon">✨</div>
            <h1>Bonjour.</h1>
            <p>Comment puis-je vous aider aujourd'hui ?</p>
        </div>
    </div>

    <div class="input-area">
        <div id="attachment-preview" class="attachment-preview"></div>
        <div class="input-box-wrapper">
            <button id="file-btn" title="Joindre un fichier">+</button>
            <input type="file" id="file-input" style="display: none;" accept="image/*,.txt,.pdf,.json,.js,.html,.css">
            <textarea id="user-input" rows="1" placeholder="Posez une question..."></textarea>
            <button id="send-btn" title="Envoyer">↑</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="memory.js?v=1.0"></script>
    <script src="tools.js?v=1.0"></script>
    <script src="ai.js?v=1.0"></script>
    <script src="brain.js?v=1.0"></script>

    <script>
        // Logique globale du Chronomètre
        if (!window.chronoTimers) window.chronoTimers = {};
        
        function startChrono(id) {
            if (window.chronoTimers[id]) return;
            let el = document.getElementById(id);
            if (!el) return;
            let [h, m, s] = el.textContent.split(':').map(Number);
            let totalSeconds = h * 3600 + m * 60 + s;
            window.chronoTimers[id] = setInterval(() => {
                totalSeconds++;
                let hh = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
                let mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                let ss = String(totalSeconds % 60).padStart(2, '0');
                const target = document.getElementById(id);
                if (target) target.textContent = `${hh}:${mm}:${ss}`;
            }, 1000);
        }

        function stopChrono(id) {
            clearInterval(window.chronoTimers[id]);
            window.chronoTimers[id] = null;
        }

        function resetChrono(id) {
            stopChrono(id);
            const el = document.getElementById(id);
            if (el) el.textContent = "00:00:00";
        }

        // Gestion de la Sidebar et des boutons du Header
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeSidebar = document.getElementById('close-sidebar');
        const newChatBtn = document.getElementById('new-chat-btn');
        const optionsBtn = document.getElementById('options-btn');

        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        });

        closeSidebar.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });

        // Bouton Nouveau Chat (réinitialise l'écran)
        newChatBtn.addEventListener('click', () => {
            chatContainer.innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-icon">✨</div>
                    <h1>Bonjour.</h1>
                    <p>Comment puis-je vous aider aujourd'hui ?</p>
                </div>
            `;
            isFirstMessage = true;
        });

        optionsBtn.addEventListener('click', () => {
            alert("NEXA v1.0 - Mode souverain local actif.");
        });

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const attachmentPreview = document.getElementById('attachment-preview');
        const statusBadge = document.getElementById('status');

        let currentAttachment = null;
        let isFirstMessage = true;

        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusBadge.textContent = "CHARGEMENT";
            const result = await NexaTools.processLocalFile(file);
            
            if (result.error) {
                alert(result.error);
                statusBadge.textContent = "ONLINE";
                return;
            }

            currentAttachment = result;
            attachmentPreview.textContent = `📎 ${result.name}`;
            attachmentPreview.style.display = "inline-block";
            statusBadge.textContent = "FICHIER PRÊT";
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text && !currentAttachment) return;

            if (isFirstMessage) {
                chatContainer.innerHTML = '';
                isFirstMessage = false;
            }

            const userBubble = document.createElement('div');
            userBubble.className = 'message user-message';
            userBubble.textContent = text + (currentAttachment ? ` [📎 ${currentAttachment.name}]` : '');
            chatContainer.appendChild(userBubble);

            const sentAttachment = currentAttachment;
            
            userInput.value = '';
            userInput.style.height = 'auto';
            currentAttachment = null;
            attachmentPreview.style.display = 'none';
            attachmentPreview.textContent = '';
            
            chatContainer.scrollTop = chatContainer.scrollHeight;

            statusBadge.textContent = "RÉFLEXION";
            const aiBubble = document.createElement('div');
            aiBubble.className = 'message ai-message';
            aiBubble.textContent = "Nexa analyse...";
            chatContainer.appendChild(aiBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await NexaBrain.think(text, sentAttachment);
                aiBubble.innerHTML = formatResponse(response);
            } catch (err) {
                aiBubble.textContent = "Une erreur est survenue dans mon Brain.";
            }

            statusBadge.textContent = "ONLINE";
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatResponse(text) {
            if (!text) return "";
            return text.replace(/\n/g, '<br>');
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
