<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Fond avec glow subtil */
    .bg-glow {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(56, 189, 248, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 30%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      flex-direction: column;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 1px;
      font-weight: 500;
    }

    .menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-btn span {
      display: block;
      width: 16px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 1px;
      position: relative;
    }

    .menu-btn span::before,
    .menu-btn span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 16px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 1px;
    }

    .menu-btn span::before { top: -5px; }
    .menu-btn span::after { top: 5px; }

    /* Greeting */
    .greeting {
      position: relative;
      z-index: 10;
      padding: 24px 24px 28px;
      text-align: center;
    }

    .greeting h1 {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .greeting p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.4;
      max-width: 280px;
      margin: 0 auto;
    }

    .greeting p span {
      color: #a78bfa;
      font-weight: 500;
    }

    /* Grid des domaines */
    .domains {
      position: relative;
      z-index: 10;
      flex: 1;
      padding: 0 16px 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      border-radius: 20px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card.active {
      background: linear-gradient(145deg, rgba(14, 165, 233, 0.25), rgba(56, 189, 248, 0.15));
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .card:not(.active) {
      background: rgba(255, 255, 255, 0.04);
      opacity: 0.72;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
    }

    .card.active .card-sub {
      color: #7dd3fc;
    }

    .card-icon {
      position: absolute;
      right: 14px;
      bottom: 14px;
      font-size: 28px;
      opacity: 0.9;
    }

    .card.active .card-icon {
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    /* Couleurs spécifiques pour chaque carte (légères) */
    .card[data-domain="robotics"] { border-color: rgba(168, 85, 247, 0.2); }
    .card[data-domain="energy"]   { border-color: rgba(234, 179, 8, 0.2); }
    .card[data-domain="auto"]     { border-color: rgba(249, 115, 22, 0.2); }
    .card[data-domain="care"]     { border-color: rgba(236, 72, 153, 0.2); }
    .card[data-domain="business"] { 
      grid-column: 1 / -1;
      border-color: rgba(20, 184, 166, 0.2);
    }

    /* Barre de saisie flottante */
    .input-bar {
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 50;
      max-width: 480px;
      margin: 0 auto;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 8px 10px 8px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .plus-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #e2e8f0;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f5f9;
      font-size: 16px;
      padding: 0 12px;
      font-family: inherit;
    }

    .input-field::placeholder {
      color: #64748b;
    }

    .mic-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      border: none;
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
    }

    /* Safe area iPhone */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .input-bar {
        bottom: calc(16px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header>
    <div class="logo">
      <div class="logo-text">NEXA</div>
      <div class="logo-sub">Neural Expressive</div>
    </div>
    <div class="menu-btn">
      <span></span>
    </div>
  </header>

  <section class="greeting">
    <h1>Bonjour</h1>
    <p>Votre assistant IA pour un quotidien plus <span>intelligent</span>.</p>
  </section>

  <main class="domains">
    <!-- Maison - ACTIVE -->
    <div class="card active" data-domain="maison">
      <div>
        <div class="card-title">Maison</div>
        <div class="card-sub">Active</div>
      </div>
      <div class="card-icon">🏠</div>
    </div>

    <!-- Work -->
    <div class="card" data-domain="work">
      <div>
        <div class="card-title">Work</div>
        <div class="card-sub">Bureau & tâches</div>
      </div>
      <div class="card-icon">💼</div>
    </div>

    <!-- Robotics -->
    <div class="card" data-domain="robotics">
      <div>
        <div class="card-title">Robotics</div>
        <div class="card-sub">Automatisation</div>
      </div>
      <div class="card-icon">🤖</div>
    </div>

    <!-- Energy -->
    <div class="card" data-domain="energy">
      <div>
        <div class="card-title">Energy</div>
        <div class="card-sub">Efficacité & réseau</div>
      </div>
      <div class="card-icon">⚡</div>
    </div>

    <!-- Auto -->
    <div class="card" data-domain="auto">
      <div>
        <div class="card-title">Auto</div>
        <div class="card-sub">Véhicules & mobilité</div>
      </div>
      <div class="card-icon">🚗</div>
    </div>

    <!-- Care -->
    <div class="card" data-domain="care">
      <div>
        <div class="card-title">Care</div>
        <div class="card-sub">Bien-être & suivi</div>
      </div>
      <div class="card-icon">❤️</div>
    </div>

    <!-- Business (pleine largeur) -->
    <div class="card" data-domain="business">
      <div>
        <div class="card-title">Business</div>
        <div class="card-sub">Analyse & croissance</div>
      </div>
      <div class="card-icon">📈</div>
    </div>
  </main>

  <!-- Barre de saisie -->
  <div class="input-bar">
    <div class="input-container">
      <button class="plus-btn">+</button>
      <input type="text" class="input-field" placeholder="Demandez à NEXA..." />
      <button class="mic-btn">🎤</button>
    </div>
  </div>

  <script>
    // Placeholder : on ne touche pas encore à la logique
    // Les cartes non actives ne font rien pour l'instant
    document.querySelectorAll('.card:not(.active)').forEach(card => {
      card.style.cursor = 'default';
    });

    document.querySelector('.card.active').style.cursor = 'pointer';
  </script>
</body>
</html>
