<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #030308;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 90% 60% at 50% 110%, rgba(56, 189, 248, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 15% 25%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 18px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-text {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 500;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-btn span {
      display: block;
      width: 17px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 1px;
      position: relative;
    }
    .menu-btn span::before,
    .menu-btn span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 17px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 1px;
    }
    .menu-btn span::before { top: -5.5px; }
    .menu-btn span::after  { top: 5.5px; }

    .greeting {
      position: relative;
      z-index: 10;
      padding: 28px 24px 32px;
      text-align: center;
    }

    .greeting h1 {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -1.2px;
      margin-bottom: 10px;
      color: #f8fafc;
    }

    .greeting p {
      font-size: 15.5px;
      color: #94a3b8;
      line-height: 1.45;
    }

    .greeting p span {
      color: #c084fc;
      font-weight: 500;
    }

    .domains {
      position: relative;
      z-index: 10;
      flex: 1;
      padding: 0 16px 110px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      border-radius: 22px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 118px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    /* ===== MAISON ACTIVE (très vive) ===== */
    .card.active {
      background: linear-gradient(145deg, rgba(14, 165, 233, 0.38), rgba(56, 189, 248, 0.22));
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 
        0 0 32px rgba(56, 189, 248, 0.45),
        0 0 12px rgba(56, 189, 248, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .card.active .card-title {
      color: #ffffff;
    }

    .card.active .card-sub {
      color: #7dd3fc;
    }

    /* ===== AUTRES CARTES (plus colorées) ===== */
    .card:not(.active) {
      background: rgba(255, 255, 255, 0.05);
      opacity: 0.92;
    }

    .card[data-domain="work"] {
      border-color: rgba(148, 163, 184, 0.35);
    }
    .card[data-domain="robotics"] {
      border-color: rgba(168, 85, 247, 0.45);
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.12), rgba(168, 85, 247, 0.04));
    }
    .card[data-domain="energy"] {
      border-color: rgba(234, 179, 8, 0.45);
      background: linear-gradient(145deg, rgba(234, 179, 8, 0.12), rgba(234, 179, 8, 0.04));
    }
    .card[data-domain="auto"] {
      border-color: rgba(249, 115, 22, 0.45);
      background: linear-gradient(145deg, rgba(249, 115, 22, 0.12), rgba(249, 115, 22, 0.04));
    }
    .card[data-domain="care"] {
      border-color: rgba(236, 72, 153, 0.45);
      background: linear-gradient(145deg, rgba(236, 72, 153, 0.12), rgba(236, 72, 153, 0.04));
    }
    .card[data-domain="business"] {
      grid-column: 1 / -1;
      border-color: rgba(20, 184, 166, 0.4);
      background: linear-gradient(145deg, rgba(20, 184, 166, 0.12), rgba(20, 184, 166, 0.04));
    }

    .card-title {
      font-size: 17.5px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 12.5px;
      color: #94a3b8;
    }

    .card-icon {
      position: absolute;
      right: 16px;
      bottom: 16px;
      font-size: 30px;
      line-height: 1;
    }

    .card.active .card-icon {
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
    }

    /* Barre de saisie */
    .input-bar {
      position: fixed;
      bottom: 22px;
      left: 16px;
      right: 16px;
      z-index: 50;
      max-width: 480px;
      margin: 0 auto;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 30px;
      padding: 8px 10px 8px 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .plus-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #e2e8f0;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f5f9;
      font-size: 16.5px;
      padding: 0 12px;
      font-family: inherit;
    }

    .input-field::placeholder {
      color: #64748b;
    }

    .mic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      border: none;
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.5);
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .input-bar {
        bottom: calc(14px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header>
    <div>
      <div class="logo-text">NEXA</div>
      <div class="logo-sub">Neural Expressive</div>
    </div>
    <div class="menu-btn"><span></span></div>
  </header>

  <section class="greeting">
    <h1>Bonjour</h1>
    <p>Votre assistant IA pour un quotidien plus <span>intelligent</span>.</p>
  </section>

  <main class="domains">
    <div class="card active" data-domain="maison">
      <div>
        <div class="card-title">Maison</div>
        <div class="card-sub">Active</div>
      </div>
      <div class="card-icon">🏠</div>
    </div>

    <div class="card" data-domain="work">
      <div>
        <div class="card-title">Work</div>
        <div class="card-sub">Bureau & tâches</div>
      </div>
      <div class="card-icon">💼</div>
    </div>

    <div class="card" data-domain="robotics">
      <div>
        <div class="card-title">Robotics</div>
        <div class="card-sub">Automatisation</div>
      </div>
      <div class="card-icon">🤖</div>
    </div>

    <div class="card" data-domain="energy">
      <div>
        <div class="card-title">Energy</div>
        <div class="card-sub">Efficacité & réseau</div>
      </div>
      <div class="card-icon">⚡</div>
    </div>

    <div class="card" data-domain="auto">
      <div>
        <div class="card-title">Auto</div>
        <div class="card-sub">Véhicules & mobilité</div>
      </div>
      <div class="card-icon">🚗</div>
    </div>

    <div class="card" data-domain="care">
      <div>
        <div class="card-title">Care</div>
        <div class="card-sub">Bien-être & suivi</div>
      </div>
      <div class="card-icon">❤️</div>
    </div>

    <div class="card" data-domain="business">
      <div>
        <div class="card-title">Business</div>
        <div class="card-sub">Analyse & croissance</div>
      </div>
      <div class="card-icon">📈</div>
    </div>
  </main>

  <div class="input-bar">
    <div class="input-container">
      <button class="plus-btn">+</button>
      <input type="text" class="input-field" placeholder="Demandez à NEXA..." />
      <button class="mic-btn">🎤</button>
    </div>
  </div>

  <script>
    document.querySelectorAll('.card:not(.active)').forEach(card => {
      card.style.cursor = 'default';
    });
    document.querySelector('.card.active').style.cursor = 'pointer';
  </script>
</body>
</html>
