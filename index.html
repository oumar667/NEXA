<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXA</title>
    <style>
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --surface-hover: #2b2c2e;
            --text-main: #e3e3e3;
            --text-secondary: #8e918f;
            --accent-color: #a8c7fa;
            --accent-gradient: linear-gradient(135deg, #9bbcf2 0%, #c4b5fd 100%);
            --border-color: #333538;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* En-tête minimaliste style Gemini */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--surface-color);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        /* Zone de discussion */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
            max-width: 600px;
            margin: auto;
            width: 100%;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 2.2rem;
            font-weight: 500;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .welcome-screen p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.4;
        }

        /* Bulles de messages */
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--surface-color);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: transparent;
            color: var(--text-main);
            align-self: flex-start;
            padding-left: 0;
            padding-right: 0;
        }

        /* Barre de saisie flottante */
        .input-area {
            padding: 16px 20px 24px 20px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            border-radius: 28px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--text-secondary);
        }

        #file-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #file-btn:hover {
            background-color: var(--surface-hover);
            color: var(--text-main);
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 8px 12px;
            outline: none;
            resize: none;
            max-height: 120px;
        }

        #user-input::placeholder {
            color: var(--text-secondary);
        }

        #send-btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        #send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .attachment-preview {
            font-size: 0.8rem;
            color: var(--accent-color);
            background: rgba(168, 199, 250, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            align-self: flex-start;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>✨</span> NEXA
        </div>
        <div id="status" class="status-badge">PRÊT</div>
    </header>

    <div id="chat-container">
        <div class="welcome-screen">
            <h1>Bonjour.</h1>
            <p>Je suis NEXA. Votre espace de travail intelligent et personnel.</p>
        </div>
    </div>

    <div class="input-area">
        <div id="attachment-preview" class="attachment-preview"></div>
        <div class="input-box-wrapper">
            <button id="file-btn" title="Joindre un fichier">+</button>
            <input type="file" id="file-input" style="display: none;" accept="image/*,.txt,.pdf,.json,.js,.html,.css">
            <textarea id="user-input" rows="1" placeholder="Posez une question à NEXA..."></textarea>
            <button id="send-btn" title="Envoyer">↑</button>
        </div>
    </div>

    <!-- Scripts de l'application -->
    <script src="memory.js"></script>
    <script src="tools.js"></script>
    <script src="ai.js"></script>
    <script src="brain.js"></script>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const attachmentPreview = document.getElementById('attachment-preview');
        const statusBadge = document.getElementById('status');

        let currentAttachment = null;
        let isFirstMessage = true;

        // Gestionnaire du bouton fichier
        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusBadge.textContent = "Lecture...";
            const result = await NexaTools.processLocalFile(file);
            
            if (result.error) {
                alert(result.error);
                statusBadge.textContent = "PRÊT";
                return;
            }

            currentAttachment = result;
            attachmentPreview.textContent = `📎 Fichier joint : ${result.name}`;
            attachmentPreview.style.display = "inline-block";
            statusBadge.textContent = "FICHIER PRÊT";
        });

        // Ajustement automatique du textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Envoi du message
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text && !currentAttachment) return;

            if (isFirstMessage) {
                chatContainer.innerHTML = '';
                isFirstMessage = false;
            }

            // Affichage message utilisateur
            const userBubble = document.createElement('div');
            userBubble.className = 'message user-message';
            userBubble.textContent = text + (currentAttachment ? ` [📎 ${currentAttachment.name}]` : '');
            chatContainer.appendChild(userBubble);

            const sentAttachment = currentAttachment;
            
            // Reset input
            userInput.value = '';
            userInput.style.height = 'auto';
            currentAttachment = null;
            attachmentPreview.style.display = 'none';
            attachmentPreview.textContent = '';
            
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Indicateur de réflexion
            statusBadge.textContent = "RÉFLÉCHIT...";
            const aiBubble = document.createElement('div');
            aiBubble.className = 'message ai-message';
            aiBubble.textContent = "Nexa réfléchit...";
            chatContainer.appendChild(aiBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Appel au Cerveau
                const response = await NexaBrain.think(text, sentAttachment);
                aiBubble.innerHTML = formatResponse(response);
            } catch (err) {
                aiBubble.textContent = "Une erreur est survenue dans mon Brain.";
            }

            statusBadge.textContent = "PRÊT";
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatResponse(text) {
            if (!text) return "";
            // Remplacement des sauts de ligne et rendu HTML sécurisé pour les liens/boutons
            return text.replace(/\n/g, '<br>');
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
