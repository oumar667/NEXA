<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 20px;
      border-bottom: 1px solid #242731;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      font-size: 12px;
      color: #888;
    }

    .status.online {
      color: #4ade80;
    }

    main {
      flex: 1;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
    }

    .welcome {
      margin-top: 20px;
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9296a3;
      line-height: 1.5;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.5;
      max-width: 90%;
      white-space: pre-wrap;
    }

    .user {
      background: #1d2330;
      margin-left: auto;
    }

    .nexa {
      background: #14171f;
      border: 1px solid #252a35;
    }

    .thinking {
      color: #9296a3;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #292e39;
      background: #11141b;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">NEXA</div>
      <div class="status" id="status">BRAIN • OFFLINE</div>
    </header>

    <main>

      <div class="welcome">
        <h1>Bonjour.</h1>
        <p>
          Je suis NEXA. Votre système intelligent personnel.
        </p>
      </div>

      <div id="chat"></div>

      <div class="input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="Écrivez à NEXA..."
        >

        <button onclick="sendMessage()">Envoyer</button>
      </div>

    </main>

  </div>

  <!-- La mémoire de NEXA -->
  <script src="memory.js"></script>

  <!-- Les outils de NEXA -->
  <script src="tools.js"></script>

  <!-- Le modèle IA de NEXA -->
  <script src="ai.js"></script>

  <!-- Le cerveau de NEXA -->
  <script src="brain.js"></script>

  <script>
    const statusEl = document.getElementById("status");
    const chat = document.getElementById("chat");

    // Si le Brain est bien chargé, on passe le statut en ONLINE
    if (typeof NexaBrain !== "undefined") {
      statusEl.textContent = "BRAIN • ONLINE";
      statusEl.classList.add("online");
    }

    // Réaffiche les derniers messages enregistrés en mémoire
    function restoreHistory() {
      if (typeof NexaMemory === "undefined") return;

      const history = NexaMemory.getHistory();

      for (const item of history) {
        const div = document.createElement("div");
        div.className = "message " + (item.role === "user" ? "user" : "nexa");
        div.textContent = item.text;
        chat.appendChild(div);
      }
    }

    restoreHistory();

    async function sendMessage() {

      const input = document.getElementById("messageInput");

      const message = input.value.trim();

      if (!message) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      // Message d'attente pendant que NEXA réfléchit
      const nexaMessage = document.createElement("div");
      nexaMessage.className = "message nexa thinking";
      nexaMessage.textContent = "NEXA réfléchit…";

      chat.appendChild(nexaMessage);
      nexaMessage.scrollIntoView({ behavior: "smooth", block: "end" });

      let reply;

      if (typeof NexaBrain !== "undefined") {
        try {
          reply = await NexaBrain.think(message);
        } catch (e) {
          reply = "Une erreur est survenue dans mon Brain. Réessayez.";
        }
      } else {
        reply = "Le Brain n'est pas chargé. Vérifiez que brain.js existe.";
      }

      nexaMessage.classList.remove("thinking");
      nexaMessage.textContent = reply;
      nexaMessage.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
