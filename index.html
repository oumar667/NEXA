<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA - IA Personnelle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      text-align: center;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #38bdf8;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .nexa {
      align-self: flex-start;
      background-color: #1e293b;
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
      border: 1px solid #334155;
    }
    #input-container {
      padding: 12px 16px;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:active {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEXA</h1>
  </header>

  <div id="chat-container"></div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Pose une question à NEXA..." autocomplete="off">
    <button id="send-btn">Envoyer</button>
  </div>

  <!-- Charger les modules JavaScript -->
  <script src="memory.js"></script>
  <script src="tools.js"></script>
  <script src="ai.js"></script>
  <script src="brain.js"></script>

  <!-- Script de gestion de l'interface du tchat -->
  <script>
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      try {
        let reply = "";
        if (typeof NexaBrain !== "undefined") {
          if (typeof NexaBrain.process === "function") {
            reply = await NexaBrain.process(text);
          } else if (typeof NexaBrain.processInput === "function") {
            reply = await NexaBrain.processInput(text);
          } else if (typeof NexaBrain.ask === "function") {
            reply = await NexaBrain.ask(text);
          } else {
            reply = "Brain connecté mais aucune fonction de traitement trouvée.";
          }
        } else {
          reply = "Erreur : NexaBrain n'est pas chargé.";
        }
        addMessage(reply, "nexa");
      } catch (err) {
        console.error(err);
        addMessage("Une erreur s'est produite lors du traitement.", "nexa");
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>

</body>
</html>
