<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: #080c14;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      text-align: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .nexa {
      align-self: flex-start;
      background: #111827;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    #input-container {
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder {
      color: #64748b;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    button {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <div class="status-dot"></div>
    <h1>NEXA</h1>
  </header>

  <div id="chat-container"></div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Pose une question à NEXA..." autocomplete="off">
    <button id="send-btn">Envoyer</button>
  </div>

  <!-- Chargement des modules JS -->
  <script src="memory.js"></script>
  <script src="tools.js"></script>
  <script src="ai.js"></script>
  <script src="brain.js"></script>

  <!-- Logique de chat -->
  <script>
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      try {
        let reply = "";
        if (typeof NexaBrain !== "undefined" && typeof NexaBrain.think === "function") {
          reply = await NexaBrain.think(text);
        } else {
          reply = "Erreur : le Brain n'est pas prêt.";
        }
        addMessage(reply, "nexa");
      } catch (err) {
        console.error(err);
        addMessage("Une erreur est survenue lors de la réponse.", "nexa");
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>

</body>
</html>
