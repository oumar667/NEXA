<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1329;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 18px;
      text-align: center;
      background-color: #0b1329;
      border-bottom: 1px solid #1e293b;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .nexa {
      align-self: flex-start;
      background-color: #1e293b;
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
      border: 1px solid #334155;
    }
    #input-container {
      padding: 12px 16px;
      background-color: #0b1329;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background-color: #131c31;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    input::placeholder {
      color: #64748b;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:active {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEXA</h1>
  </header>

  <div id="chat-container"></div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Pose une question à NEXA..." autocomplete="off">
    <button id="send-btn">Envoyer</button>
  </div>

  <!-- Chargement des modules -->
  <script src="memory.js"></script>
  <script src="tools.js"></script>
  <script src="ai.js"></script>
  <script src="brain.js"></script>

  <!-- Gestion des messages -->
  <script>
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      try {
        let reply = "";
        if (typeof NexaBrain !== "undefined" && typeof NexaBrain.think === "function") {
          reply = await NexaBrain.think(text);
        } else {
          reply = "Erreur : le Brain n'est pas prêt.";
        }
        addMessage(reply, "nexa");
      } catch (err) {
        console.error(err);
        addMessage("Une erreur est survenue lors de la réponse.", "nexa");
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>

</body>
</html>
